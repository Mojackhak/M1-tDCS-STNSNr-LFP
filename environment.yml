name: lfptp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - cmcrameri
  - h5py
  - matplotlib
  - nibabel
  - numba
  - numpy
  - openpyxl
  - pandas
  - pypdf
  - poppler
  - pyyaml
  - scikit-learn
  - scipy
  - statsmodels
  - r-base=4.5
  - r-dplyr
  - r-emmeans
  - r-jsonlite
  - r-lme4
  - r-lmertest
  - r-pbkrtest
  - r-readr

# LFP-TensorPipe, Sextant, SimNIBS, MATLAB, and Lead-DBS are external workflow
# dependencies and must be installed separately when their corresponding input
# or structural-processing stages are run.
