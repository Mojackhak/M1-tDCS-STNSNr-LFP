analysis:
  id: phase-by-lat-contact-paired
  question: Contact-paired Phase effects and Phase-by-laterality interaction within each region and polarity.

paths:
  table_root: /path/to/data/summary/table
  feature_manifest: /path/to/data/summary/table/manifest/feature_outputs_all.csv
  output_root: /path/to/data/summary/stats
  manifest_root: /path/to/data/summary/stats/manifest/phase-by-lat-contact-paired

inputs:
  manifest_select:
    Stage: aggregate_contact
    SourceStage: transform
    AggregationLevel: contact
    Representation: scalar
  match_policy:
    missing_whitelist: error
    duplicate_whitelist: error
    unlisted_candidates: report
  row_filter:
    IncludeAggregate: true
    finite_columns: [Value]

band_sets:
  canonical: &canonical_bands
    - delta
    - theta
    - alpha
    - beta_low
    - beta_high
    - gamma_low
    - gamma_high

canonical_region:
  local: &canonical_local_regions
    - SNr
    - STN
  connectivity:
    undirected: &canonical_undirected_pair_regions
      - SNr-STN
    directed: &canonical_directed_pair_regions
      - "SNr→STN"

feature_whitelist:
  local:
    region_column: Region
    region_values: *canonical_local_regions
    metrics:
      aperiodic:
        outputs:
          mean-scalar:
            bands: [exponent, offset]
      burst:
        outputs:
          mean-scalar:
            bands: *canonical_bands
          duration-scalar:
            bands: *canonical_bands
          rate-scalar:
            bands: *canonical_bands
          occupancy-scalar:
            bands: *canonical_bands
      periodic:
        outputs:
          mean-scalar:
            bands: *canonical_bands
      raw_power:
        outputs:
          mean-scalar:
            bands: *canonical_bands

  connectivity:
    region_column: PairRegion
    metrics:
      ciplv:
        region_values: *canonical_undirected_pair_regions
        outputs:
          mean-scalar:
            bands: *canonical_bands
      imcoh_abs:
        region_values: *canonical_undirected_pair_regions
        outputs:
          mean-scalar:
            bands: *canonical_bands
      wpli:
        region_values: *canonical_undirected_pair_regions
        outputs:
          mean-scalar:
            bands: *canonical_bands
      psi:
        region_values: *canonical_directed_pair_regions
        outputs:
          mean-scalar:
            bands: *canonical_bands
      trgc:
        region_values: *canonical_directed_pair_regions
        outputs:
          mean-scalar:
            bands: *canonical_bands

strata:
  Polar: [Anodal, Cathodal]

grouping:
  local: [Metric, FeatureOutput, Band, Region, Polar]
  connectivity: [Metric, FeatureOutput, Band, PairRegion, Polar]

contact_pairing:
  local_column: Channel
  connectivity_column: ChannelPair
  output_column: ContactUnitID
  complete_factor: Phase
  complete_levels: [Pre, Early, Late, Post]
  laterality_factor: Lat
  laterality_levels: [Ipsi, Contra]
  require_both_laterality_per_id: false
  incomplete: retain_and_report

model_data:
  factor_levels:
    Phase: [Pre, Early, Late, Post]
    Lat: [Ipsi, Contra]
  factor_columns: [ID, ContactUnitID]
  require_all_factor_levels_per_model: true
  require_complete_subjects: false
  minimum_n_ID: null

model:
  engine: lmer
  formula: "Value ~ Phase * Lat + (1 | ID) + (1 | ID:ContactUnitID)"
  reml: true
  optimizer: default
  df_method: kenward-roger

tests:
  - id: Phase
    kind: joint_term
    term: Phase

  - id: Phase-Lat
    kind: joint_term
    term: "Phase:Lat"

  - id: Phase
    kind: emm_pairwise
    x_var: Phase
    weights: equal
    confidence_level: 0.95
    within_adjust: tukey
    across_method: none
    primary_p: p_tukey
    contrast_direction: later_minus_earlier

  - id: Phase-Lat
    kind: emm_pairwise
    x_var: Phase
    panel_var: Lat
    weights: equal
    confidence_level: 0.95
    within_adjust: tukey
    across_method: none
    primary_p: p_tukey
    contrast_direction: later_minus_earlier

identity:
  model_id_fields:
    local: [Domain, Metric, FeatureOutput, Band, Region, Polar]
    connectivity: [Domain, Metric, FeatureOutput, Band, PairRegion, Polar]
  test_key_fields: [ModelID, TestKind, TestID]
  field_key_case: lower-kebab
  element_separator: "_"
  key_value_separator: "-"
  value_character_map:
    "_": "-"
    ":": "-"

outputs:
  inherit_source_parent:
    path_column: Path
    relative_to: table_root
  hierarchy:
    - source_parent
    - Representation
    - FeatureOutput
    - Band
    - RegionValue
    - Polar
    - EngineDirectory
  engine_directories:
    lmer: lmer_model
  result_identity_fields:
    - AnalysisID
    - ModelID
    - TestKind
    - TestID
    - Engine
  filename_fields:
    test_result: [AnalysisID, TestID, TestKind, ResultType]
    model_fit: [AnalysisID, ResultType]
  filename_key_map:
    AnalysisID: analysis
    TestID: test
    TestKind: kind
    ResultType: result
  element_separator: "_"
  key_value_separator: "-"
  value_character_map:
    "_": "-"
    ":": "-"
  model_fit: true
  diagnostic_plots: false

manifests:
  models:
    filename: models.csv
    fields:
      - AnalysisID
      - ModelID
      - Engine
      - Formula
      - Domain
      - Metric
      - FeatureOutput
      - Representation
      - Band
      - RegionVariable
      - RegionValue
      - Polar
      - SourcePath
      - IncludeAggregateRequired
      - FiniteValueRequired
      - n_rows
      - n_ID
      - n_contact_units
      - n_contact_units_ipsi
      - n_contact_units_contra
      - n_ID_both_lat
      - n_ID_complete8
      - Singular
      - Status
      - Message
  tests:
    filename: tests.csv
    fields:
      - AnalysisID
      - ModelID
      - TestKind
      - TestID
      - Term
      - XVar
      - PanelVar
      - FacetVar
      - Weights
      - ConfidenceLevel
      - WithinAdjust
      - AcrossMethod
      - PrimaryP
      - ContrastDirection
      - Status
      - Message
  contact_pairing:
    filename: contact_pairing.csv
    fields:
      - AnalysisID
      - ModelID
      - Domain
      - Metric
      - FeatureOutput
      - Band
      - RegionVariable
      - RegionValue
      - Polar
      - ID
      - SourceContactColumn
      - ContactUnitID
      - Lat
      - ObservedPhases
      - MissingPhases
      - CompletePhase
      - IDHasBothLat
      - Included
      - ExclusionReason
  outputs:
    filename: outputs.csv
    fields:
      - AnalysisID
      - ModelID
      - TestKind
      - TestID
      - ResultType
      - Path
      - Rows
      - Columns
      - Status

execution:
  on_singular: continue
  on_not_estimable: record
  on_error: fail
