visualization:
  id: submission-lat-trajectory
  kind: lat_trajectory

paths:
  source_root: /path/to/data/summary/stats/derived/laterality-within-polar
  stats_root: /path/to/results/submission/data/lat
  statistics: /path/to/results/submission/data/lat/statistics.csv
  pairing: /path/to/results/submission/data/lat/pairing.csv
  runtime_root: /path/to/data/tmp/lat/trajectory
  output_root: /path/to/results/submission/data/lat/trajectory
  manifest_root: /path/to/results/submission/data/lat/trajectory

inputs:
  stats_analysis_id: laterality-within-polar
  accepted_model_statuses: [ok, singular, convergence_warning]
  selection: {column: p_holm, operator: lt, value: 0.05}
  fit_phases: [Early, Late, Post]
  anchor_phase: Pre
  component_columns: {Ipsi: IpsiValue, Contra: ContraValue}
  component_difference: {minuend: Ipsi, subtrahend: Contra}
  difference_tolerance: 1.0e-10
  source_strata_fields: [Polar]
  figure_condition_fields: [Polar]
  row_filter:
    IncludeAggregate: true
    finite_columns: [IpsiValue, ContraValue]

figures:
  - id: Phase-Lat-overlay
    test_id: Phase
    layout: laterality_overlay
    x_var: Phase
    line_var: Lat
    condition_var: Polar

factor_levels:
  Phase: [Pre, Early, Late, Post]
  Lat: [Ipsi, Contra]

model:
  formula: "Value ~ Phase * Lat + (1 | ID)"
  factor_columns: [ID]
  emmeans: {x_var: Phase, panel_var: Lat, facet_var: null}
  reml: true
  df_method: kenward-roger
  confidence_level: 0.95

labels:
  polarity: {Anodal: "⊕", Cathodal: "⊖"}
  region:
    SNr: SNr
    STN: STN
    SNr-STN: "SNr–STN"
    "SNr→STN": "SNr→STN"
  bands:
    delta: "δ"
    theta: "θ"
    alpha: "α"
    beta_low: "low-β"
    beta_high: "high-β"
    gamma_low: "low-γ"
    gamma_high: "high-γ"
  delta_prefix: "Δ "
  y_axis:
    aperiodic:
      exponent: Aperiodic exponent
      offset: Aperiodic offset
      knee: Aperiodic knee
    periodic:
      default: "{Band} periodic power (dB)"
    raw_power:
      default: "{Band} total power (dB)"
    burst:
      mean: '$\log_{10}$ {Band} burst amplitude (V)'
      duration: '$\log_{10}$ {Band} burst duration (s)'
      rate: '$\operatorname{asinh}$ {Band} burst rate (Hz)'
      occupancy: "{Band} burst occupancy (%)"
    ciplv:
      default: '$\operatorname{logit}$({Band} ciPLV)'
    imcoh_abs:
      default: '$z_{\mathrm{Fisher}}$({Band} |ImCoh|)'
    wpli:
      default: '$\operatorname{logit}$({Band} wPLI)'
    psi:
      default: "{Band} PSI"
    trgc:
      default: "{Band} TRGC"

style:
  font:
    latin: Arial Unicode MS
    greek: Arial Unicode MS
    axis_pt: 7
    strip_pt: 7
    legend_pt: 6
    significance_pt: 7
    tick_pt: 6
    sample_size_pt: 6
  line_width_pt:
    default: 0.60
    emm_line: 0.75
    emm_ci: 1.00
  series:
    order: [Ipsi, Contra]
    Ipsi: {color: "#F2000E", line_style: "-", zorder: 4}
    Contra: {color: "#0E6AAF", line_style: "-", zorder: 8}
    mean_marker: o
    mean_marker_size_pt: 2
    mean_marker_edge_width_pt: 0
    ci_cap_pt: 2
  geometry_mm:
    phase_width: 6
    panel_height: 25
    strip_top_height: 4.5
    strip_pad: 2
    x_label_offset: 5
    y_label_offset: 7
  strips:
    top_background: "#D7E3E0"
    text_color: black
    font_weight: bold
  y_limits:
    lower_padding_fraction: 0.15
    upper_padding_fraction: 0.30
  axes:
    grid: false
    show_top_right_spines: false
  legend:
    location: outside_right
    frame: false
    order: [Ipsi, Contra]
  transparent: true
  dpi: 600

sample_size:
  show: true
  template: "{n_1}/{n_2}"
  color: "#2C2C2C"
  y_axes: 0.00
  vertical_alignment: bottom

significance:
  p_column: p_holm
  hide_non_significant: true
  thresholds:
    - {p_lt: 0.001, label: "***"}
    - {p_lt: 0.01, label: "**"}
    - {p_lt: 0.05, label: "*"}
  star_offset_fraction: 0.07

reference_line:
  value: 0
  color: "#9A9A9A"
  line_style: ":"
  line_width_pt: 0.60
  alpha: 0.80
  zorder: 2

outputs:
  format: pdf
  directory_fields: [OutputGroup]
  filename_template: "{Band}_{RegionValue}_{Polar}_Ipsi-Contra.pdf"
  formal_png: false
  hashes: false

manifests:
  figures: figures.csv
  coverage: coverage.csv
  emmeans: emmeans.csv
  statistics: statistics.csv
  model_fit: model-fit.csv

execution:
  on_error: fail
  retry: false
  cache: false
  resume: false
