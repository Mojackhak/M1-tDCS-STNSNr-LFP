visualization:
  id: pre-by-polar
  kind: scalar

paths:
  source_root: /path/to/data/summary/stats/derived/pre-by-polar
  stats_root: /path/to/data/summary/stats
  models_manifest: /path/to/data/summary/stats/manifest/pre-by-polar/models.csv
  stats_outputs_manifest: /path/to/data/summary/stats/manifest/pre-by-polar/outputs.csv
  output_root: /path/to/data/summary/viz
  manifest_root: /path/to/data/summary/viz/manifest/pre-by-polar

inputs:
  stats_analysis_id: pre-by-polar
  accepted_model_statuses: [ok, singular, convergence_warning]
  test_kind: emmean_vs_null
  row_filter:
    IncludeAggregate: true
    finite_columns: [Value]

figures:
  - id: Lat
    test_id: Lat
    x_var: Lat

factor_levels:
  Phase: [Pre]
  Lat: [Ipsi, Contra]

labels:
  polarity:
    Anodal: "⊕"
    Cathodal: "⊖"
  contrast:
    Anodal-minus-Cathodal: "⊕−⊖"
  region:
    SNr: SNr
    STN: STN
    SNr-STN: "SNr–STN"
    "SNr→STN": "SNr→STN"
  bands:
    delta: "δ"
    theta: "θ"
    alpha: "α"
    beta_low: "low-β"
    beta_high: "high-β"
    gamma_low: "low-γ"
    gamma_high: "high-γ"
  y_axis:
    aperiodic:
      exponent: Aperiodic exponent
      offset: Aperiodic offset
      knee: Aperiodic knee
    periodic:
      default: "{Band} periodic power (dB)"
    raw_power:
      default: "{Band} total power (dB)"
    burst:
      mean: '$\log_{10}$ {Band} burst amplitude (V)'
      duration: '$\log_{10}$ {Band} burst duration (s)'
      rate: '$\operatorname{asinh}$ {Band} burst rate (Hz)'
      occupancy: "{Band} burst occupancy (%)"
    ciplv:
      default: '$\operatorname{logit}$({Band} ciPLV)'
    imcoh_abs:
      default: '$z_{\mathrm{Fisher}}$({Band} |ImCoh|)'
    wpli:
      default: '$\operatorname{logit}$({Band} wPLI)'
    psi:
      default: "{Band} PSI"
    trgc:
      default: "{Band} TRGC"

style:
  phase_palette:
    Pre: "#F2000E"
  font:
    latin: Arial Unicode MS
    greek: Arial Unicode MS
    axis_pt: 7
    strip_pt: 7
    bracket_pt: 7
    tick_pt: 6
    sample_size_pt: 6
  line_width_pt:
    default: 0.60
    emm_line: 0.75
    emm_ci: 1.00
    box_edge: 0.65
    median: 0.65
    raw_mean: 0.65
    whisker: 0.65
    cap: 0.65
    significance_bracket: 0.65
  geometry_mm:
    phase_width: 12
    panel_height: 25
    panel_gap: [3, 3]
    strip_top_height: 4.5
    strip_right_width: 4.5
    strip_pad: 2
    x_label_offset: 5
    y_label_offset: 7
  strips:
    top_background: "#D7E3E0"
    right_background: "#E3DCCF"
    text_color: black
    font_weight: bold
  jitter:
    width: 0.20
    size: 2
    alpha: 1
    seed: 42
  box:
    width: 0.55
    fill_alpha: 0.30
    whiskers: tukey
    outlier_marker_size: 0
  emm:
    color: black
    line_style: "-"
    mean_marker: "o"
    mean_marker_size_pt: 2
    mean_marker_edge_width_pt: 0
    ci_cap_pt: 0
  raw_mean:
    color: "#404040"
    line_style: "--"
  y_limits:
    lower_padding_fraction: 0.15
    upper_padding_fraction: 0.30
    share_within_figure: true
  axes:
    grid: false
    show_top_right_spines: false
    reference_lines: true
  legend: false
  transparent: true
  dpi: 600

sample_size:
  show: true
  id_column: ID
  template: "{n_ID}"
  color: "#2C2C2C"
  y_axes: 0.00
  vertical_alignment: bottom

significance:
  mode: emmean_vs_null
  p_column: p_raw
  hide_non_significant: true
  marker_offset_fraction: 0.035
  thresholds:
    - p_lt: 0.001
      label: "***"
    - p_lt: 0.01
      label: "**"
    - p_lt: 0.05
      label: "*"

reference_line:
  value: 0
  color: "#9A9A9A"
  line_style: ":"
  line_width_pt: 0.60
  alpha: 0.80
  zorder: 8

outputs:
  format: pdf
  filename_template: "analysis-{AnalysisID}_test-{TestID}_figure-scalar.pdf"
  inherit_stats_parent: true
  formal_png: false
  hashes: false

manifests:
  figures: figures.csv
  coverage: coverage.csv

execution:
  on_error: fail
  retry: false
  cache: false
  resume: false
