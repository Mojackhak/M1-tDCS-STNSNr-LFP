visualization:
  id: phase-trace
  kind: trace

paths:
  table_root: /path/to/data/summary/table
  feature_outputs_manifest: /path/to/data/summary/table/manifest/feature_outputs_all.csv
  output_root: /path/to/data/summary/viz
  manifest_root: /path/to/data/summary/viz/manifest/phase-trace

inputs:
  stage: aggregate_region
  source_stage: normalize
  aggregation_level: region
  representation: trace
  row_filter:
    IncludeAggregate: true
    finite_nested_value: true
  selectors:
    local:
      canonical_region: [SNr, STN]
      polar: [Anodal, Cathodal]
      features:
        - {metric: aperiodic, feature_output: mean-trace, bands: [exponent, offset]}
        - {metric: periodic, feature_output: mean-trace, bands: [delta, theta, alpha, beta_low, beta_high, gamma_low, gamma_high]}
        - {metric: raw_power, feature_output: mean-trace, bands: [delta, theta, alpha, beta_low, beta_high, gamma_low, gamma_high]}
    connectivity:
      canonical_region: [SNr-STN]
      polar: [Anodal, Cathodal]
      features:
        - {metric: ciplv, feature_output: mean-trace, bands: [delta, theta, alpha, beta_low, beta_high, gamma_low, gamma_high]}
        - {metric: imcoh_abs, feature_output: mean-trace, bands: [delta, theta, alpha, beta_low, beta_high, gamma_low, gamma_high]}
        - {metric: wpli, feature_output: mean-trace, bands: [delta, theta, alpha, beta_low, beta_high, gamma_low, gamma_high]}
        - {metric: psi, feature_output: mean-trace, bands: [delta, theta, alpha, beta_low, beta_high, gamma_low, gamma_high], canonical_region: ["SNr→STN"]}
        - {metric: trgc, feature_output: mean-trace, bands: [delta, theta, alpha, beta_low, beta_high, gamma_low, gamma_high], canonical_region: ["SNr→STN"]}

figures:
  - {id: Phase, layout: marginal, line_label: Overall}
  - {id: Phase-Lat, layout: laterality_lines, line_var: Lat, line_levels: [Ipsi, Contra]}

factor_levels:
  Phase: [Pre, Early, Late, Post]
  Lat: [Ipsi, Contra]

labels:
  polarity: {Anodal: "⊕", Cathodal: "⊖"}
  region: {SNr: SNr, STN: STN, SNr-STN: "SNr–STN", "SNr→STN": "SNr→STN"}
  bands: {delta: "δ", theta: "θ", alpha: "α", beta_low: "low-β", beta_high: "high-β", gamma_low: "low-γ", gamma_high: "high-γ"}
  value_axis:
    aperiodic: {exponent: "Δ Aperiodic exponent", offset: "Δ Aperiodic offset"}
    periodic: "Δ {Band} periodic power (dB)"
    raw_power: "Δ {Band} total power (dB)"
    ciplv: 'Δ $\operatorname{logit}$({Band} ciPLV)'
    imcoh_abs: 'Δ $z_{\mathrm{Fisher}}$({Band} |ImCoh|)'
    wpli: 'Δ $\operatorname{logit}$({Band} wPLI)'
    psi: "Δ {Band} PSI"
    trgc: "Δ {Band} TRGC"

style:
  palette: ["#F2000E", "#0E6AAF", "#0CA228", "#E87000", "#884392"]
  font: {family: Arial Unicode MS, axis_pt: 7, strip_pt: 7, tick_pt: 6, legend_pt: 6}
  line_width_pt: {default: 0.60, mean: 1.00, boundary: 0.60, reference: 0.60}
  geometry_mm:
    panel_width: 30
    panel_height: 25
    panel_gap: [3, 3]
    strip_top_height: 4.5
    strip_right_width: 4.5
    strip_pad: 2
    x_label_offset: 5
    y_label_offset: 7
  strips:
    top_background: "#D7E3E0"
    right_background: "#E3DCCF"
    text_color: black
    font_weight: bold
  ribbon: {kind: sem, alpha: 0.30}
  smoothing:
    enabled: true
    method: lowess
    fraction: 0.05
    iterations: 3
    delta_seconds: 0.2
    scope: each_input_series
    persist_smoothed_values: false
  axes:
    x_label: "Time (s)"
    x_limits: [0, 240]
    x_log: false
    y_log: false
    grid: false
    show_top_right_spines: false
  temporal_boundaries: [60, 120, 180]
  boundary_line: {color: "#404040", style: ":", alpha: 0.60}
  horizontal_reference: {values: [0], color: "#9A9A9A", style: ":", alpha: 0.80, zorder: 8}
  legend:
    show: true
    location: outside_right
    frame: true
    fancybox: true
    frame_alpha: 0.90
    face_color: white
    edge_color: "#CCCCCC"
    edge_width: 0.60
  transparent: true
  dpi: 600

inference:
  enabled: false
  interval_manifest: null
  significance_annotations: false
  alpha: 0.05
  interval_shadow_alpha: 0.15
  interval_star_pt: 7

outputs:
  format: pdf
  filename_template: "analysis-{AnalysisID}_test-{TestID}_figure-trace.pdf"
  formal_png: false
  hashes: false

manifests: {figures: figures.csv, coverage: coverage.csv}
execution: {on_error: fail, retry: false, cache: false, resume: false}
